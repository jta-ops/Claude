server {
    listen 80;
    server_name schoolblock.daily www.schoolblock.daily;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name schoolblock.daily www.schoolblock.daily;

    ssl_certificate     /etc/letsencrypt/live/schoolblock.daily/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schoolblock.daily/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    add_header X-Frame-Options          DENY        always;
    add_header X-Content-Type-Options   nosniff     always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;

    root /var/www/schoolblock/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        limit_req zone=api_submit burst=5 nodelay;
    }

    location /downloads/ {
        alias /var/www/schoolblock/data/downloads/;
        add_header Content-Disposition attachment;
    }

    limit_req_zone $binary_remote_addr zone=api_submit:10m rate=5r/m;
}
