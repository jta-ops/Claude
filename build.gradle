// ============================================================
// build.gradle  –  Root project (shared configuration)
// ============================================================
//
// This file runs ONCE for the root project and once for every
// subproject listed in settings.gradle.
//
// The 'subprojects { }' block below applies identically to
// 1.20.1/ and 1.21.1/ (and any future version you add).
// ============================================================

plugins {
    // Declare fabric-loom here so Gradle downloads it, but use
    // 'apply false' — we'll apply it inside each subproject.
    id 'fabric-loom' version '1.9-SNAPSHOT' apply false
}

// ---------------------------------------------------------------------------
// Shared configuration applied to every version subproject
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: 'fabric-loom'

    // ---------- Java version ----------
    // Java 21 is required for Minecraft 1.21+.
    // Fabric Loader 0.15+ also supports Java 21 on 1.20.x, so we use 21
    // everywhere for consistency.
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        withSourcesJar()    // also produce a *-sources.jar
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release  = 21
    }

    // ---------- Version & group (from gradle.properties) ----------
    version = rootProject.mod_version
    group   = rootProject.maven_group

    // ---------------------------------------------------------------------------
    // Multi-version source strategy
    // ---------------------------------------------------------------------------
    // We do NOT compile 'common/' as a separate library.  Instead, we inject
    // its source directory directly into each version subproject's main source
    // set.  Gradle then compiles common + version-specific code together in one
    // pass, using the correct Minecraft jars for that version.
    //
    // Pros:  simple, no cross-project classpath headaches
    // Cons:  common code is recompiled for every version (fine for a mod)
    // ---------------------------------------------------------------------------
    sourceSets {
        main {
            java {
                // Each version's own code (version-specific MC API calls)
                srcDir 'src/main/java'
                // Shared code (pure Java, no direct MC imports)
                srcDir rootProject.file('common/src/main/java')
            }
            resources {
                srcDir 'src/main/resources'
                srcDir rootProject.file('common/src/main/resources')
            }
        }
    }

    // ---------------------------------------------------------------------------
    // Resource token expansion
    // ---------------------------------------------------------------------------
    // fabric.mod.json contains ${version}, ${minecraft_version} etc.
    // processResources substitutes them at build time.
    processResources {
        inputs.property 'version',          project.version
        // minecraft_version is set in each subproject's build.gradle via ext {}
        inputs.property 'minecraft_version', project.ext.minecraft_version
        inputs.property 'loader_version',    project.ext.loader_version

        filteringCharset 'UTF-8'

        filesMatching('fabric.mod.json') {
            expand 'version':           project.version,
                   'minecraft_version': project.ext.minecraft_version,
                   'loader_version':    project.ext.loader_version
        }
    }

    // ---------------------------------------------------------------------------
    // Jar naming
    // ---------------------------------------------------------------------------
    // Each jar gets the MC version appended so you can tell them apart:
    //   horrormod-0.1.0-1.20.1.jar
    //   horrormod-0.1.0-1.21.1.jar
    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${rootProject.mod_id}" }
        }
        archiveBaseName    = rootProject.mod_id
        archiveVersion     = project.version
        archiveClassifier  = project.name   // '1.20.1' or '1.21.1'
    }
}
